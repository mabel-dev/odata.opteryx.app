# SEC-07: OWASP ZAP API scan of https://odata.opteryx.app through the fleet's reusable
# workflow. This file owns only the triggers and the target. The scan and the
# upload of every finding to opteryx.ops.pipeline_scan_findings are defined
# once in mabel-dev/.github. Report only: findings never fail it.
# Safe mode: only the GET and HEAD operations in its OpenAPI document are
# called, and no attack payloads are sent.
name: DAST Scan

on:
  # After each deploy, so a new release is checked as soon as it is live.
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  schedule:
    # Same minute as security_scan.yaml (sha256 of the repo name mod 60), an hour later.
    - cron: '14 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dast-scan:
    # A failed deploy left the previous release live; the nightly run covers it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write  # OIDC to authenticate.opteryx for the upload; no stored secret
    uses: mabel-dev/.github/.github/workflows/dast_scan.yaml@main
    with:
      url: https://odata.opteryx.app
      openapi: /openapi.json
