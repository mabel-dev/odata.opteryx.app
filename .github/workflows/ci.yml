name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    # This job name is the status-check context used by branch protection.
    # Deliberately NOT a matrix: a matrix would render it "Run tests (3.14)",
    # so bumping the Python version would rename the check and silently stop
    # the required-check rule from ever matching again.
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Must satisfy requires-python in pyproject.toml (>=3.14); on 3.13 the
          # `pip install -e .` step below fails before any test runs.
          python-version: "3.14"

      - name: Install dependencies
        # Dependencies only -- the service code is imported directly from
        # ./app (see tests/conftest.py), not installed as a package, matching
        # how the Dockerfile installs with `uv sync --no-install-project`.
        run: |
          python -m pip install --upgrade pip
          python - <<'PY' > requirements-ci.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          deps = project["dependencies"] + project["optional-dependencies"]["test"]
          print("\n".join(deps))
          PY
          pip install -r requirements-ci.txt

      - name: Run test suite
        # `make t` runs the whole of tests/. Catalog-backed tests skip
        # automatically when there are no GCP credentials, which is the case here.
        run: make t
