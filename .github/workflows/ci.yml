name: CI

on:
  # Not on push to main: deploy.yaml runs this suite there (as its first job) and deploys
  # only if it passes; a second run here would test the same commit twice.
  pull_request:
    branches: [ main ]
  # Lets deploy.yaml gate on this exact suite, so that check can never drift from the one
  # that runs on PRs.
  workflow_call:
  workflow_dispatch: {}

# id-token: opteryx-core is installed from Artifact Registry, which needs a Google token
# (pyproject.toml [tool.uv.sources]). A caller (deploy.yaml) must grant the same.
permissions:
  id-token: write
  contents: read

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/762690895289/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SERVICE_ACCOUNT: gh-deploy@mabeldev.iam.gserviceaccount.com

jobs:
  test:
    # This job name is the status-check context used by branch protection.
    # Deliberately NOT a matrix: a matrix would render it "Run tests (3.14)",
    # so bumping the Python version would rename the check and silently stop
    # the required-check rule from ever matching again.
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Must satisfy requires-python in pyproject.toml (>=3.14).
          python-version: "3.14"

      - name: Authenticate to Google Cloud (opteryx-core is read from Artifact Registry)
        # Token only: no credentials file and no GOOGLE_APPLICATION_CREDENTIALS, so the
        # catalog-backed tests still find no credentials and skip, as before. They must not
        # reach production data as the deploy identity.
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Install dependencies
        # Dependencies only -- the service code is imported directly from
        # ./app (see tests/conftest.py), not installed as a package, matching
        # how the Dockerfile installs with `uv sync --no-install-project`.
        #
        # uv, not pip: opteryx-core comes from Artifact Registry through
        # [tool.uv.sources], which pip ignores - it would look for the pin on PyPI.
        env:
          UV_INDEX_OPTERYX_WHEELS_USERNAME: oauth2accesstoken
          UV_INDEX_OPTERYX_WHEELS_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: |
          python -m pip install uv
          python -m uv pip install --system -r pyproject.toml --extra test

      - name: Run test suite
        # `make t` runs the whole of tests/. Catalog-backed tests skip
        # automatically when there are no GCP credentials, which is the case here.
        run: make t
