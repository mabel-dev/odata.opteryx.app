[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-odata"
version = "0.0.22"
description = "Opteryx OData Service"
requires-python = '>=3.14'
dependencies = [
    "Brotli==1.2.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "google-cloud-firestore==2.28.1",
    "google-cloud-secret-manager==2.30.0",
    "google-cloud-storage==3.13.1",
    "opteryx-catalog>=0.4.102",
    "opteryx-core>=0.9.78",
    "opteryx_access>=0.2.3",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "sly==0.5",
    "uvicorn[standard]==0.38.0",
    "valkey==6.1.1",
]

[project.optional-dependencies]
test = [
    "httpx2==2.9.1",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Only the maintained suite: tests/manual holds developer scripts (see its
# README) and app/vendored ships the upstream odata-query test suite -- neither
# is ours to keep green.
testpaths = ["tests"]
norecursedirs = ["manual", "app/vendored"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["app/vendored/", "tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
