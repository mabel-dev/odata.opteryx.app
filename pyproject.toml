[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-odata"
version = "0.0.18"
description = "Opteryx OData Service"
requires-python = '>=3.14'
dependencies = [
    "brotli-asgi==1.6.0",
    "cryptography==46.0.5",
    "fastapi==0.135.1",
    "google-cloud-firestore==2.25.0",
    "google-cloud-secret-manager==2.26.0",
    "google-cloud-storage==3.9.0",
    "orjson==3.11.7",
    "opteryx-catalog==0.4.*",
    "opteryx-core>=0.9.16,<0.10",
    "python-dateutil==2.9.0.post0",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.22",
    "requests==2.32.5",
    "sly==0.5",
    "uvicorn[standard]==0.38.0",
    "valkey==6.1.1",
]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["app/vendored/", "tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
