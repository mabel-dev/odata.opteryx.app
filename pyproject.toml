[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-odata"
version = "0.0.22"
description = "Opteryx OData Service"
requires-python = '>=3.14'
dependencies = [
    "Brotli==1.2.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    # Pinned to 2.25.0 deliberately: 2.26.0 through 2.29.0 percent-encode the
    # default database id into the resource path, so every read of the
    # `(default)` database fails with `InvalidArgument: 400 Invalid database id
    # %28default%29`. Omitting the `database` argument does not avoid it -- the
    # encoding happens either way. Named databases are unaffected, which is why
    # the catalog (database `catalogs`) kept working while the config client
    # silently fell back to defaults for every key.
    "google-cloud-firestore==2.25.0",
    "google-cloud-secret-manager==2.30.0",
    "google-cloud-storage==3.13.1",
    "opteryx-catalog[kms]>=0.4.108",
    "opteryx-core>=0.9.79",
    "opteryx-access>=0.2.4",
    "opteryx-iceberg>=0.1.7",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "sly==0.5",
    "uvicorn[standard]==0.38.0",
    "valkey==6.1.1",
]

[project.optional-dependencies]
test = [
    "httpx2==2.9.1",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Only the maintained suite: tests/manual holds developer scripts (see its
# README) and app/vendored ships the upstream odata-query test suite -- neither
# is ours to keep green.
testpaths = ["tests"]
norecursedirs = ["manual", "app/vendored"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["app/vendored/", "tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
