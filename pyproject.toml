[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-odata"
version = "0.0.27"
description = "Opteryx OData Service"
requires-python = '>=3.14'
dependencies = [
    "Brotli==1.2.1",
    "cryptography==50.0.2",
    "fastapi==0.162.2",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-secret-manager==2.32.0",
    "google-cloud-storage==3.17.1",
    "opteryx-shared-services[web,storage,secrets]>=0.3.0",
    "opteryx-core==0.9.201",
    "opteryx-catalog[kms]>=0.4.180",
    "opteryx-access>=0.2.18",
    "opteryx-iceberg>=0.1.23",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.33",
    "requests==2.34.2",
    "sly==0.5",
    "uvicorn[standard]==0.38.0",
    "valkey==6.2.0",

    # google-api-core 2.35.0 (released 2026-08-24) percent-encodes values in
    # path_template.expand, so the (default) database id reaches Firestore as
    # %28default%29 and every gRPC read fails with INVALID_ARGUMENT
    # "Invalid database id %28default%29". Named databases are unaffected.
    # Remove the cap once upstream ships a fixed release.
    "google-api-core<2.44.0",
]

[project.optional-dependencies]
test = [
    "httpx2==2.9.1",
    "pytest",
]

# opteryx-core comes from Artifact Registry (`opteryx-wheels`), never PyPI. opteryx-core's
# `gar-*` tags publish there only (cp314, x86_64 + aarch64 - what production runs); PyPI releases
# are rarer and have gaps, so a version the SaaS needs may never be on PyPI. `explicit`: this
# index serves opteryx-core and nothing else, and opteryx-core is never looked for on PyPI.
#
# The index needs credentials: uv reads them from UV_INDEX_OPTERYX_WHEELS_USERNAME
# (`oauth2accesstoken`) and UV_INDEX_OPTERYX_WHEELS_PASSWORD (`gcloud auth print-access-token`).
# Install with uv: pip ignores [tool.uv.*] and would look for the pin on PyPI. There are no
# macOS wheels in this channel.
[[tool.uv.index]]
name = "opteryx-wheels"
url = "https://us-east1-python.pkg.dev/mabeldev/opteryx-wheels/simple/"
explicit = true

[tool.uv.sources]
opteryx-core = { index = "opteryx-wheels" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Only the maintained suite: tests/manual holds developer scripts (see its
# README) and app/vendored ships the upstream odata-query test suite -- neither
# is ours to keep green.
testpaths = ["tests"]
norecursedirs = ["manual", "app/vendored"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["app/vendored/", "tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
