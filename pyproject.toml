[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-odata"
version = "0.0.16"
description = "Opteryx OData Service"
requires-python = '>=3.13'
dependencies = [
    "brotli-asgi==1.6.0",
    "cryptography==49.0.0",
    "fastapi==0.138.0",
    "google-cloud-firestore==2.27.0",
    "google-cloud-secret-manager==2.29.0",
    "google-cloud-storage==3.12.0",
    "orjson==3.11.9",
    "orso==0.0.243",
    "opteryx-catalog==0.4.*",
    "opteryx-core==0.6.*",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "sly==0.5",
    "uvicorn[standard]==0.38.0",
]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["app/vendored/", "tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
