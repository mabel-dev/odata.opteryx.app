options:
  env:
    - 'AR_REGION=us-east1'
    - 'AR_REPOSITORY=cloud-run-source-deploy'
steps:
  # opteryx-core is installed from the private opteryx-wheels Python repo; hand
  # the build an access token as a BuildKit secret.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args: [ '-c', 'gcloud auth print-access-token > /workspace/gar_token' ]
  - name: 'gcr.io/cloud-builders/docker'
    env: [ 'DOCKER_BUILDKIT=1' ]
    args: [ 'build', '--secret', 'id=gar_token,src=/workspace/gar_token', '-t', 'us-east1-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/opteryx-odata:$SHORT_SHA', '.' ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'us-east1-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/opteryx-odata:$SHORT_SHA' ]
images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/opteryx-odata:$SHORT_SHA'
